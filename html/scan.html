<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cfx-nui-whip_core/html/css/fonts.css">
    <link rel="stylesheet" href="https://cfx-nui-whip_core/html/css/base.css">
    <style>
        /* Atlas 1024 x 1024 (client/scan.lua reads the same layout):
           cards     x 0-511,   y 0-383    6 cells of 256 x 128
           legend    x 512-1023, y 0-639   512 x 640 (camera)
           icons     x 512+,    y 640      64 x 64: dots green/yellow/red, rings green/yellow/red, camera badge, trail arrow
           tags      x 512+,    y 704      64 x 80: marker tag too fresh/ready/gone soon
           digits    x 512+,    y 784      32 x 64: 0-9
           marks     x 0-511,   y 384-1023 64 cells of 64 x 80: whole markers (tag, number, photo badge), painted
                                           for the markers in view, so a marker is one picture per frame */
        html, body { width: 1024px; height: 1024px; margin: 0; overflow: hidden; background: transparent; }
        body { font-family: var(--ui-font, 'Barlow', sans-serif); color: var(--ui-text, rgba(255, 255, 255, 0.93)); }
        .abs { position: absolute; box-sizing: border-box; }

        /* cards */
        .cell { width: 240px; height: 112px; }
        .card {
            width: 100%; height: 100%; box-sizing: border-box; padding: 12px 14px;
            background: var(--ui-surface-raised, rgba(10, 12, 18, 0.9));
            border: 1px solid var(--ui-border, rgba(255, 255, 255, 0.08));
            border-radius: var(--ui-radius-pop, 12px);
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .head { display: flex; align-items: center; gap: 8px; }
        .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
        .no { flex: none; min-width: 26px; height: 26px; padding: 0 5px; box-sizing: border-box; border-radius: 6px;
              background: #fde047; color: #111; font-size: 18px; font-weight: 800; line-height: 26px; text-align: center; }
        .title { font-size: 22px; font-weight: 700; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dist { margin-left: auto; flex: none; white-space: nowrap; font-size: 17px; font-weight: 600; color: var(--ui-text-mid, rgba(255, 255, 255, 0.5)); }
        .chips { display: flex; gap: 6px; flex-wrap: wrap; max-height: 56px; overflow: hidden; }
        .chip {
            font-size: 15px; font-weight: 600; line-height: 1; padding: 5px 8px; border-radius: var(--ui-radius-sm, 6px);
            background: var(--ui-surface-hover-strong, rgba(255, 255, 255, 0.10)); white-space: nowrap;
        }

        /* legend and photo */
        .panel { width: 512px; height: 640px; }
        .sheet {
            box-sizing: border-box; padding: 16px 18px 14px;
            background: var(--ui-surface-raised, rgba(10, 12, 18, 0.9));
            border: 1px solid var(--ui-border, rgba(255, 255, 255, 0.08));
            border-radius: var(--ui-radius-pop, 12px);
        }
        .label { font-size: 15px; font-weight: 700; letter-spacing: 3px; color: #fde047; }
        .street { font-size: 24px; font-weight: 700; line-height: 1.15; margin-top: 4px; }
        .sub { font-size: 15px; font-weight: 600; color: var(--ui-text-mid, rgba(255, 255, 255, 0.55)); margin-top: 3px; }
        .rows { margin-top: 10px; }
        .row { display: flex; align-items: center; gap: 9px; padding: 5px 0; border-top: 1px solid rgba(255, 255, 255, 0.07); }
        .row .title { font-size: 18px; flex: none; }
        .info { font-size: 15px; font-weight: 600; color: var(--ui-text-mid, rgba(255, 255, 255, 0.55));
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .row .dist { font-size: 15px; flex: none; }
        .more, .hint { font-size: 14px; font-weight: 600; color: var(--ui-text-mid, rgba(255, 255, 255, 0.5)); margin-top: 8px; }
        .car .no { background: #60a5fa; }
        .body .no { background: #a78bfa; }
        .cam { flex: none; width: 20px; height: 20px; }
        .badge { width: 46px; height: 46px; border-radius: 50%; background: #0f172a; border: 3px solid #fff;
                 display: flex; align-items: center; justify-content: center; box-sizing: border-box; }

        /* icons, tags, digits */
        .icon { width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; }
        .icon .fill { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.85); box-sizing: border-box; }
        .icon .ring { width: 54px; height: 54px; border-radius: 50%; border: 5px solid; box-sizing: border-box; }
        .tag { width: 64px; height: 80px; }
        .tag .body {
            position: absolute; left: 6px; top: 4px; width: 52px; height: 68px; box-sizing: border-box;
            background: #fde047; border: 3px solid #111; border-radius: 8px 8px 4px 4px; overflow: hidden;
        }
        .tag .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 13px; border-top: 2px solid #111; }
        .digit { width: 32px; height: 64px; display: flex; align-items: center; justify-content: center;
                 font-size: 54px; font-weight: 800; line-height: 1; color: #111; }
        .mark .num { position: absolute; left: 6px; top: 7px; width: 52px; height: 50px; display: flex; align-items: center;
                     justify-content: center; font-weight: 800; line-height: 1; color: #111; letter-spacing: -1px; }
        .mark .cam { position: absolute; right: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: #0f172a;
                     border: 2px solid #fff; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
    </style>
    <link rel="stylesheet" href="pure-theme.css">
    <link rel="stylesheet" href="pure-scan.css">
</head>
<body>
    <div id="atlas"></div>
    <script>
        const COLORS = { green: '#57d38c', yellow: '#f2c94c', red: '#ff6b6b', blue: '#8fb8ff' };
        const STRIPE = ['#8fb8ff', '#57d38c', '#ff6b6b'];   // tag: too fresh (blue), ready (green), gone soon (red)
        const atlas = document.getElementById('atlas');

        function box(cls, x, y, html) {
            const el = document.createElement('div');
            el.className = 'abs ' + cls;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            if (html) el.innerHTML = html;
            atlas.appendChild(el);
            return el;
        }

        const cards = [];
        for (let i = 0; i < 6; i++) cards.push(box('cell', (i % 2) * 256 + 8, Math.floor(i / 2) * 128 + 8));
        const legend = box('panel', 512, 0);

        ['green', 'yellow', 'red'].forEach((c, i) => {
            box('icon', 512 + i * 64, 640, `<div class="fill" style="background:${COLORS[c]}"></div>`);
            box('icon', 512 + (i + 3) * 64, 640, `<div class="ring" style="border-color:${COLORS[c]}"></div>`);
            box('tag', 512 + i * 64, 704, `<div class="body"><div class="stripe" style="background:${STRIPE[i]}"></div></div>`);
        });
        for (let d = 0; d <= 9; d++) box('digit', 512 + d * 32, 784, String(d));
        // bodies: a purple tag and the letter L ("L1", "L2", ...)
        box('tag', 512 + 3 * 64, 704, `<div class="body" style="background:#c3a6ff"><div class="stripe" style="background:#7a5cc7"></div></div>`);
        box('digit', 512 + 10 * 32, 784, 'L');
        // vehicles: a blue tag and the letter V ("V1", "V2", ...)
        box('tag', 512 + 4 * 64, 704, `<div class="body" style="background:#8fb8ff"><div class="stripe" style="background:#3f6fc9"></div></div>`);
        box('digit', 512 + 11 * 32, 784, 'V');

        // camera glyph: badge on photographed markers, icon in legend rows
        const CAM = (c) => `<svg viewBox="0 0 24 24" width="100%" height="100%"><path fill="${c}" d="M9 4h6l1.6 2.2H20a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.2a2 2 0 0 1 2-2h3.4z"/><circle cx="12" cy="13" r="4.2" fill="none" stroke="${c === '#fff' ? '#0e1013' : '#14110a'}" stroke-width="2.2"/></svg>`;
        box('icon', 512 + 6 * 64, 640, `<div class="badge"><div style="width:26px;height:26px">${CAM('#fff')}</div></div>`);
        // arrow (pointing up): the way a bleeding person walked
        box('icon', 512 + 7 * 64, 640, `<svg viewBox="0 0 64 64" width="64" height="64"><path d="M32 4 L54 34 H40 V60 H24 V34 H10 Z" fill="#ff6b6b" stroke="#14110a" stroke-width="3" stroke-linejoin="round"/></svg>`);

        // whole markers: { i, k = 0/1/2 (phase) or 'L' / 'V', t = text, p = photographed }
        const marks = [];
        for (let i = 0; i < 64; i++) marks.push(box('tag mark', (i % 8) * 64, 384 + Math.floor(i / 8) * 80));
        const MARK_BG = { L: ['#c3a6ff', '#7a5cc7'], V: ['#8fb8ff', '#3f6fc9'] };
        function paintMarks(list) {
            for (const m of list) {
                const el = marks[m.i];
                if (!el) continue;
                if (!m.t) { el.innerHTML = ''; continue; }
                const c = MARK_BG[m.k] || ['#f2c94c', STRIPE[m.k] || STRIPE[1]];
                const t = String(m.t);
                const size = t.length <= 1 ? 44 : (t.length === 2 ? 34 : 25);
                el.innerHTML = `<div class="body" style="background:${c[0]}"><div class="stripe" style="background:${c[1]}"></div></div>
                    <div class="num" style="font-size:${size}px">${esc(t)}</div>
                    ${m.p ? `<div class="cam"><div style="width:13px;height:13px">${CAM('#fff')}</div></div>` : ''}`;
            }
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function paintCard(d) {
            const el = cards[d.cell];
            if (!el) return;
            if (!d.title) { el.innerHTML = ''; return; }
            const chips = (d.chips || []).map((c) => {
                const style = c.color ? ` style="color:${COLORS[c.color] || '#fff'}"` : '';
                return `<span class="chip"${style}>${esc(c.text)}</span>`;
            }).join('');
            const tagBg = d.body ? '#c3a6ff' : (d.car ? '#8fb8ff' : '');
            const no = d.no ? `<span class="no"${tagBg ? ` style="background:${tagBg}"` : ''}>${esc(d.no)}</span>`
                            : `<span class="dot" style="background:${COLORS[d.color] || COLORS.blue}"></span>`;
            el.innerHTML = `<div class="card">
                <div class="head">${no}<span class="title">${esc(d.title)}</span><span class="dist">${esc(d.dist || '')}</span></div>
                <div class="chips">${chips}</div></div>`;
        }

        // legend (camera)
        function paintSheet(el, d) {
            if (!d.street) { el.innerHTML = ''; return; }
            const rows = (d.rows || []).map((r) => `<div class="row${r.car ? ' car' : ''}${r.body ? ' body' : ''}">
                <span class="no">${esc(r.no)}</span><span class="title">${esc(r.title)}</span>
                <span class="info"${r.color ? ` style="color:${COLORS[r.color]}"` : ''}>${esc(r.info || '')}</span>
                ${r.photo ? `<span class="cam">${CAM('#57d38c')}</span>` : ''}
                <span class="dist">${esc(r.dist || '')}</span></div>`).join('');
            el.innerHTML = `<div class="sheet">
                <div class="label">${esc(d.label || 'CRIME SCENE')}</div>
                <div class="street">${esc(d.street)}</div>
                <div class="sub">${esc(d.sub || '')}</div>
                <div class="rows">${rows || `<div class="more">${esc(d.empty || 'Nothing in the picture.')}</div>`}</div>
                ${d.more ? `<div class="more">${esc(d.more)}</div>` : ''}
                ${d.hint ? `<div class="hint">${esc(d.hint)}</div>` : ''}</div>`;
        }

        window.addEventListener('message', (e) => {
            const d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
            if (d && d.action === 'marks') return paintMarks(d.list || []);
            if (!d || d.action !== 'paint') return;
            if (d.cell === 'legend') paintSheet(legend, d);
            else paintCard(d);
        });
    </script>
    <script src="https://cfx-nui-pure-whip-police/html/shared/bracket.js"></script>
    <script src="pure-kit.js"></script>
    <script src="pure-scan.js"></script>
</body>
</html>
